<!DOCTYPE html>
<html lang="en">
<head>
    <title>hover</title>
    <style>
        button {
            width: 200px;
            height: 50px;
            color: black;
            font-size: 24px;
            background-color: green;

        }
        button:hover {
            background-color: red;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button>Clik Me</button>
</body>
</html>
