<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexbox</title>
    <style>
        #container {
            display: flex;
            flex-wrap: wrap;
        }

        #container > div {
            background-color: green;
            margin: 20px;
            padding: 20px;
            font-size: 20px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div>1.Palestine</div>
        <div>2.Syria</div>
        <div>3.Lebanon</div>
        <div>4.Jordan</div>
        <div>5.Egypt</div>
        <div>6.Turkey</div>
        <div>7.Iraq</div>
        <div>8.Kuwait</div>
        <div>9.Saudi Arabia</div>
        <div>10.UAE</div>
        <div>11.Oman</div>
        <div>12.Qatar</div>
    </div>
</body>
</html>
